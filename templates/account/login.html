{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log In - Bookstore{% endblock title %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-lock fs-1 text-warning"></i>
        <h2 class="h3 fw-bold text-dark mt-2">Welcome Back</h2>
        <p class="text-muted small">Log in to manage your account and purchases</p>
      </div>

      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-grid gap-2 mt-4">
          <button class="btn btn-warning fw-medium text-dark py-2" type="submit">
            Log In
          </button>
        </div>
      </form>

      <div class="text-center mt-3 pt-3 border-top">
        <p class="small text-muted mb-0">
          Don't have an account? <a href="{% url 'account_signup' %}" class="text-decoration-none fw-semibold">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock content %}

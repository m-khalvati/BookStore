{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Up - Bookstore{% endblock title %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus fs-1 text-warning"></i>
        <h2 class="h3 fw-bold text-dark mt-2">Create Account</h2>
        <p class="text-muted small">Join our community to explore and review books</p>
      </div>

      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-grid gap-2 mt-4">
          <button class="btn btn-warning fw-medium text-dark py-2" type="submit">
            Sign Up
          </button>
        </div>
      </form>

      <div class="text-center mt-3 pt-3 border-top">
        <p class="small text-muted mb-0">
          Already have an account? <a href="{% url 'account_login' %}" class="text-decoration-none fw-semibold">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
